<!DOCTYPE html>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page" data-reveal>

            <span class="eyebrow-index">01</span>
            <span class="eyebrow-rule" aria-hidden="true"></span>

          <h1 class="display" aria-label="Coming Soon.">
            <span class="display-line display-line--coming">
              <span class="display-word">COMING</span>

          <span class="side-meta__item">People</span>
          <span class="side-meta__rule"></span>
          <span class="side-meta__item">Ideas</span>
          <span class="side-meta__rule"></span>

        </aside>
      </main>

      <footer class="footer">
        <a class="contact" href="mailto:info@together2050.com">info@together2050.com</a>
        <p class="copyright">© 2026 TOGETHER2050</p>
